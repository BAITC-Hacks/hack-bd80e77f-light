name: Тесты

# Автотесты требований ТЗ, календаря остатка, сценариев и сверки Python ↔ браузер
# при каждом изменении кода.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
