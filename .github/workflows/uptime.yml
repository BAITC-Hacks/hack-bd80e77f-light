name: Проверка сайта

# Каждые 3 часа серверы GitHub проверяют онлайн-версию https://umny-zakup.vercel.app:
# доступность, совпадение данных с репозиторием и расчёт по всем артикулам.
# При ошибке GitHub присылает письмо автору этого расписания.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "scripts/check_site.js", ".github/workflows/uptime.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверить сайт
        run: node scripts/check_site.js https://umny-zakup.vercel.app
