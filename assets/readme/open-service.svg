<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260" role="img" aria-labelledby="title desc">
  <title id="title">Открыть работающий сервис «Умный Закуп»</title>
  <desc id="desc">Кликабельная кнопка запуска MVP в браузере</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b3b"/>
      <stop offset="0.52" stop-color="#0755c9"/>
      <stop offset="1" stop-color="#00a6e8"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#ffca3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001129" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1438" height="258" rx="32" fill="url(#bg)" stroke="#39c6ff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="80" cy="42" r="145" fill="#159cff" opacity=".13"/>
  <circle cx="1355" cy="218" r="185" fill="#37d5ff" opacity=".12"/>
  <path d="M0 202 C220 126 326 249 525 164 S844 85 1008 146 1240 202 1440 92" fill="none" stroke="#47c9ff" stroke-opacity=".26" stroke-width="3"/>
  <path d="M0 226 C207 149 350 257 541 190 S838 118 1018 167 1250 221 1440 123" fill="none" stroke="#8de7ff" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(66 65)" filter="url(#glow)">
    <circle cx="57" cy="57" r="55" fill="#063571" stroke="#71dcff" stroke-width="3"/>
    <path d="M28 67h18l10-31 17 55 12-38 10 14h20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="190" y="100" fill="#9eeaff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">РАБОТАЮЩИЙ MVP</text>
  <text x="190" y="146" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Прогнозируйте дефицит до того,</text>
  <text x="190" y="184" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">как он остановит продажи</text>
  <text x="190" y="222" fill="#d9f5ff" font-family="Arial, Helvetica, sans-serif" font-size="20">Без установки · открывается в браузере · работает на компьютере и телефоне</text>

  <g transform="translate(1096 82)" filter="url(#shadow)">
    <rect width="284" height="96" rx="25" fill="url(#button)"/>
    <text x="142" y="59" text-anchor="middle" fill="#092650" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing=".6">ЗАПУСТИТЬ СЕРВИС →</text>
  </g>
</svg>
