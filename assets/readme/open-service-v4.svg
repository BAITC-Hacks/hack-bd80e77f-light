<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="180" viewBox="0 0 1440 180" role="img" aria-labelledby="title desc">
  <title id="title">Запустить сервис «Умный Закуп»</title>
  <desc id="desc">Работающий MVP в браузере</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b3b"/>
      <stop offset="0.52" stop-color="#0755c9"/>
      <stop offset="1" stop-color="#00a6e8"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#ffca3a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001129" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1438" height="178" rx="27" fill="url(#bg)" stroke="#39c6ff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="58" cy="20" r="120" fill="#159cff" opacity=".11"/>
  <circle cx="1370" cy="165" r="150" fill="#37d5ff" opacity=".1"/>
  <path d="M0 140 C220 76 345 169 545 112 S845 58 1012 104 1242 145 1440 70" fill="none" stroke="#5bd2ff" stroke-opacity=".22" stroke-width="3"/>

  <g transform="translate(40 35)">
    <circle cx="48" cy="48" r="46" fill="#063571" stroke="#71dcff" stroke-width="3"/>
    <path d="M23 56h15l9-25 14 43 10-29 9 11h18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="145" y="43" fill="#9eeaff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2.6">РАБОТАЮЩИЙ MVP</text>
  <text x="145" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">Прогнозируйте дефицит до того,</text>
  <text x="145" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">как он остановит продажи</text>
  <text x="145" y="150" fill="#d9f5ff" font-family="Arial, Helvetica, sans-serif" font-size="17">Работает в браузере · ⌘/Ctrl + клик — открыть в новой вкладке</text>

  <g transform="translate(1112 43)" filter="url(#shadow)">
    <rect width="280" height="94" rx="24" fill="url(#button)"/>
    <text x="140" y="57" text-anchor="middle" fill="#092650" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" letter-spacing=".5">ЗАПУСТИТЬ СЕРВИС ↗</text>
  </g>
</svg>
